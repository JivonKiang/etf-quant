name: ETF Signal & Deploy

on:
  schedule:
    # UTC 18:00 = 北京时间 2:00（完整跑）
    - cron: '0 18 * * *'
    # UTC 18:30 = 北京时间 2:30（用最新数据再验证）
    - cron: '30 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run signal monitor
        run: python signal_monitor.py
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}

      - name: Build site
        run: python build_site.py

      - name: Deploy to gh-pages
        run: |
          mkdir -p /tmp/pages
          cp index.html /tmp/pages/
          cd /tmp/pages
          git init -b gh-pages
          git add index.html
          git -c user.name=github-actions -c user.email=actions@github.com commit -m "update site $(date -u +%F-%H%M)" || true
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git gh-pages
